<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 450" width="100%" height="100%" fill="none" opacity="0.16">
  <!-- Subtle architectural sketch lines of amphitheater tiers -->
  <path d="M 0,380 Q 720,240 1440,380" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="8 4"/>
  <path d="M 120,400 Q 720,280 1320,400" stroke="#0f172a" stroke-width="2"/>
  <path d="M 240,415 Q 720,320 1200,415" stroke="#0f172a" stroke-width="1.5"/>
  <path d="M 360,430 Q 720,355 1080,430" stroke="#0f172a" stroke-width="1.2"/>
  
  <!-- Tier vertical radial dividers -->
  <line x1="720" y1="240" x2="720" y2="440" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="580" y1="265" x2="550" y2="435" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="860" y1="265" x2="890" y2="435" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="450" y1="300" x2="400" y2="430" stroke="#0f172a" stroke-width="1"/>
  <line x1="990" y1="300" x2="1040" y2="430" stroke="#0f172a" stroke-width="1"/>
  <line x1="330" y1="340" x2="260" y2="425" stroke="#0f172a" stroke-width="1"/>
  <line x1="1110" y1="340" x2="1180" y2="425" stroke="#0f172a" stroke-width="1"/>

  <!-- Academic dome / column background sketch -->
  <g opacity="0.75" stroke="#0f172a" stroke-width="1.5">
    <rect x="620" y="160" width="200" height="90" fill="none"/>
    <polygon points="610,160 720,110 830,160" fill="none"/>
    <!-- Columns -->
    <line x1="645" y1="160" x2="645" y2="250"/>
    <line x1="675" y1="160" x2="675" y2="250"/>
    <line x1="705" y1="160" x2="705" y2="250"/>
    <line x1="735" y1="160" x2="735" y2="250"/>
    <line x1="765" y1="160" x2="765" y2="250"/>
    <line x1="795" y1="160" x2="795" y2="250"/>
    <!-- Arches -->
    <path d="M 645,185 A 15,15 0 0,1 675,185"/>
    <path d="M 675,185 A 15,15 0 0,1 705,185"/>
    <path d="M 705,185 A 15,15 0 0,1 735,185"/>
    <path d="M 735,185 A 15,15 0 0,1 765,185"/>
    <path d="M 765,185 A 15,15 0 0,1 795,185"/>
    <!-- Left Wing -->
    <rect x="360" y="190" width="230" height="80" fill="none"/>
    <line x1="360" y1="215" x2="590" y2="215"/>
    <line x1="360" y1="240" x2="590" y2="240"/>
    <!-- Right Wing -->
    <rect x="850" y="190" width="230" height="80" fill="none"/>
    <line x1="850" y1="215" x2="1080" y2="215"/>
    <line x1="850" y1="240" x2="1080" y2="240"/>
  </g>

  <!-- Trees / foliage sketch -->
  <path d="M 280,260 C 270,230 250,230 240,245 C 230,225 210,230 205,250 C 190,250 185,270 200,285 L 300,285 Z" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <path d="M 1150,260 C 1160,230 1180,230 1190,245 C 1200,225 1220,230 1225,250 C 1240,250 1245,270 1230,285 L 1130,285 Z" fill="none" stroke="#0f172a" stroke-width="1.2"/>
</svg>
